name: publish

# Publishes the built nptrace.sh to the org's public artifact bucket when a
# GitHub Release is published, so consumers can vendor it with a plain curl
# while this repository stays private (nullplatform/scopes is public and cannot
# pull from a private repo).
#
# Releases originate on the nullplatform side, exactly as they do for
# catalog-tracing-js: the platform owns the version, cuts a release from a green
# build, and nullplatform-github-integration[bot] creates the matching GitHub
# Release — which fires this workflow. The version comes from the release TAG.
# NP_TRACE_VERSION in src/header.sh is NOT the source of truth; it is stamped
# from the tag here at publish time, and mirror-version.yml writes it back into
# main separately.
#
# Delivery differs from the JS SDK only because the artifact does: there is no
# registry for a shell script, so the equivalent of `npm publish` is an S3 copy
# to the same bucket the CLI publishes its binaries to.

on:
  release:
    types: [published]
  # Manual re-run for a partial/failed publish (publishing is idempotent per version).
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Version to (re)publish, e.g. 0.1.0 — must already be a release
        required: true

permissions:
  contents: read # the platform owns tags; nothing here writes to the repo

env:
  BUCKET: cli.nullplatform.com
  # Namespaced from day one: the bucket root holds the CLI's own bare version
  # directories (2.8.0/, latest/, alpha/), and moving to a dedicated host later
  # should be a DNS change, not a re-pathing of every consumer's install line.
  PREFIX: tracing-sh

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the shells and test tooling
        run: sudo apt-get update && sudo apt-get install -y dash jq bats shellcheck

      # Resolve the version BEFORE doing any work, so a malformed tag fails in
      # seconds rather than after the full matrix. Set via env and validated
      # (never inlined into the script) so a crafted tag cannot inject shell.
      - name: Resolve the version from the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          RAW=${RELEASE_TAG:-$INPUT_VERSION}
          # Tags are bare here (0.0.16, like catalog-tracing-js), but strip a
          # leading v defensively so one typed by hand still publishes correctly.
          VERSION=${RAW#v}
          if ! printf '%s' "$VERSION" \
            | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$RAW' is not a semantic version"
            exit 1
          fi
          echo "VERSION=$VERSION" >>"$GITHUB_ENV"

      - run: make lint

      - name: Build the artifact
        run: ./build.sh

      # nptrace.sh is committed so consumers can vendor it without a build step.
      # This check runs BEFORE the version is stamped in, while the working tree
      # should still match main exactly; afterwards a diff is expected.
      - name: nptrace.sh must match src/
        run: git diff --exit-code nptrace.sh

      - name: Test on every supported shell
        run: |
          for sh in /bin/dash /bin/bash; do
            echo "::group::$sh"
            NP_TEST_SHELL="$sh" bats test/unit test/integration
            echo "::endgroup::"
          done

      # busybox ash is the most limited shell/awk/od combination supported, and
      # the likeliest thing a consumer's CI image actually ships. It has already
      # caught one real defect that the other legs could not see.
      - name: Test under busybox ash
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:latest sh -c '
            apk add --no-cache bash bats jq >/dev/null
            sh build.sh >/dev/null
            NP_TEST_SHELL=/bin/sh bats test/unit test/integration
          '

      # The published artifact must report the version it is published under —
      # np_trace_init sends NP_TRACE_VERSION as the producer, so a stale value
      # would misattribute every event the SDK emits. Not committed here; the
      # tag is the source of truth and mirror-version.yml reflects it into main.
      - name: Stamp the release version into the artifact
        run: |
          set -eu
          sed -i "s/^NP_TRACE_VERSION=\".*\"\$/NP_TRACE_VERSION=\"$VERSION\"/" src/header.sh
          ./build.sh
          if ! grep -q "^NP_TRACE_VERSION=\"$VERSION\"\$" nptrace.sh; then
            echo "::error::the built artifact does not carry version $VERSION"
            exit 1
          fi

      # The workflow depends on this role; there is no degraded mode worth
      # having. Fail here, at 2s, rather than inside a cryptic AWS error later.
      - name: Require the publishing role
        env:
          AWS_ROLE: ${{ secrets.AWS_ROLE }}
        run: |
          if [ -z "$AWS_ROLE" ]; then
            echo "::error::No AWS_ROLE secret. Set it on this repository, and add"
            echo "::error::repo:${{ github.repository }}:* to that role's trust policy."
            exit 1
          fi

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: us-east-1

      - name: Publish to S3
        run: |
          set -eu
          sha256sum nptrace.sh >nptrace.sh.sha256

          put() {
            aws s3 cp "$2" "s3://$BUCKET/$PREFIX/$1/$2" \
              --acl public-read \
              --content-type "$3" \
              --cache-control "$4"
          }

          # A published version is immutable — consumers pin to it — so it is
          # written once and cached for a year. Skipping when it already exists
          # is what makes a manual re-run of a partial publish safe, the same
          # idempotency the JS SDK's publish has.
          if aws s3api head-object --bucket "$BUCKET" \
               --key "$PREFIX/$VERSION/nptrace.sh" >/dev/null 2>&1; then
            echo "$PREFIX/$VERSION/nptrace.sh already published — skipping"
          else
            IMMUTABLE="public, max-age=31536000, immutable"
            put "$VERSION" nptrace.sh        text/x-shellscript "$IMMUTABLE"
            put "$VERSION" nptrace.sh.sha256 text/plain         "$IMMUTABLE"
          fi

          # latest/ moves every release. CloudFront fronts this bucket, so it
          # must not be cached: a long default TTL would keep serving the
          # previous SDK for hours after the release landed.
          put latest nptrace.sh        text/x-shellscript "no-cache, max-age=0"
          put latest nptrace.sh.sha256 text/plain         "no-cache, max-age=0"

      # Prove the artifact is actually reachable anonymously before calling the
      # release done. An upload that lands but is not public-readable is
      # otherwise indistinguishable from a working one until a consumer hits it.
      - name: Verify the published artifact is anonymously fetchable
        run: |
          set -eu
          for dir in "$VERSION" latest; do
            BASE="https://$BUCKET/$PREFIX/$dir"
            curl -fsSL -o published.sh "$BASE/nptrace.sh"
            cmp published.sh nptrace.sh
            echo "verified $BASE/nptrace.sh"
          done
